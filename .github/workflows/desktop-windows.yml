# Build SmartLife cho Windows (Tauri v2)
# - Push tag `desktop-v*` (vd desktop-v0.1.0) → build .exe/.msi và phát hành GitHub Release
# - Chạy tay (Actions → Run workflow) với release_version = X.Y.Z → tự tạo tag desktop-vX.Y.Z + Release
# - Push thay đổi liên quan Sticky Notes / desktop → build kiểm tra + tải file cài ở mục Artifacts
name: Desktop (Windows)

on:
  push:
    # Tag: luôn chạy (GitHub không xét `paths` với tag). Nhánh: chỉ chạy khi đổi các file bên dưới.
    branches: ['**']
    tags: ['desktop-v*']
    paths:
      - 'src-tauri/**'
      - 'src/components/sticky/**'
      - 'src/services/sticky*'
      - 'src/services/desktopBridge.ts'
      - 'src/hooks/useStickyNotes.ts'
      - '.github/workflows/desktop-windows.yml'
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Phiên bản phát hành, dạng X.Y.Z (vd 0.1.0). Để trống = chỉ build thử'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-check:
    name: Web build check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # Ghi lại tên miền production thực tế (có chuyển hướng www hay không) để chẩn đoán app desktop
      - name: Check production domain
        continue-on-error: true
        run: |
          for u in https://smartlife.courses/ https://www.smartlife.courses/; do
            curl -sS -o /dev/null -m 20 -w "$u -> %{http_code} %{redirect_url}\n" "$u" || true
          done

  windows:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli@^2

      # Phiên bản phát hành: từ tag desktop-vX.Y.Z hoặc từ ô nhập khi chạy tay
      - name: Resolve release version
        id: release
        shell: pwsh
        env:
          REF_NAME: ${{ github.ref_name }}
          IS_TAG: ${{ startsWith(github.ref, 'refs/tags/desktop-v') }}
          INPUT_VERSION: ${{ inputs.release_version }}
        run: |
          $version = ''
          if ($env:IS_TAG -eq 'true') { $version = $env:REF_NAME.Replace('desktop-v', '') }
          elseif ($env:INPUT_VERSION) { $version = $env:INPUT_VERSION.Trim() }
          if ($version -and $version -notmatch '^\d+\.\d+\.\d+$') {
            Write-Error "Phiên bản '$version' không hợp lệ (cần dạng X.Y.Z)"; exit 1
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          if ($version) {
            $conf = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
            $conf.version = $version
            $conf | ConvertTo-Json -Depth 20 | Set-Content src-tauri/tauri.conf.json -Encoding utf8
          }

      - name: Build
        working-directory: src-tauri
        run: tauri build

      - uses: actions/upload-artifact@v4
        with:
          name: SmartLife-Windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

      # Tạo tag (nếu chưa có) + Release công khai
      - name: Publish release
        if: steps.release.outputs.version != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-v${{ steps.release.outputs.version }}
          target_commitish: ${{ github.sha }}
          draft: false
          make_latest: true
          name: SmartLife Desktop v${{ steps.release.outputs.version }}
          body: |
            ## SmartLife cho Windows
            - Sticky Notes nổi trên màn hình, luôn nằm trên cùng
            - Phím tắt toàn cục **Ctrl+Alt+N** tạo ghi chú mới
            - Icon khay hệ thống, ghim taskbar, khởi động cùng Windows
            - Đồng bộ realtime với web và điện thoại

            **Cài đặt:** tải file `.exe` (khuyên dùng) hoặc `.msi`. Nếu Windows SmartScreen cảnh báo, chọn *More info → Run anyway* (bản chưa ký số).
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
